manifestVersion: 1
id: meegosgift-weibox
name: WeiboX
tagline: 自托管的第三方微博：服务端持续抓取 + 轻量安卓客户端
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/weibo.png
category: social
version: "latest"
port: 8689
description: >-
  WeiboX 是自托管的第三方微博匿名浏览方案。服务端定时抓取你关注用户的微博，处理微博的防爬
  与验证码；安卓客户端只连接你自己的服务端，支持时间线、热门、特别关注、主页、评论、搜索。

  关注列表保存在你自己的服务器上，与任何微博账号无关。只支持浏览，不支持点赞、评论、转发、
  私信、发微博。


  使用 / Usage:

  1. 打开本应用，用 Umbrel 显示的密码登录 WebUI。

  2. 在「设置 → API Token」中新建 Token，搜索并关注用户。

  3. 安卓 app 设置中填写服务器地址 http://umbrel.local:8689（或局域网 IP:8689）和 API Token。


  FCM 推送（可选）：把你自己 Firebase 项目的服务账号私钥命名为 firebase-key.json，放到
  ~/umbrel/app-data/meegosgift-weibox/data/ 后重启应用。


  WeiboX is a self-hosted, read-only third-party Weibo reader: the server
  scrapes the users you follow and handles anti-scraping and captchas; the
  Android client only talks to your server. Log in to the WebUI with the
  password shown in Umbrel, create an API Token and point the app to
  http://umbrel.local:8689.
