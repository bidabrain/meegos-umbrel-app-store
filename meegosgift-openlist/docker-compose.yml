version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: meegosgift-openlist_server_1
      APP_PORT: 5244

  server:
    image: openlistteam/openlist:v4.2.9
    # OpenList >= v4.1.0 runs as a non-root user (UID 1001) and ignores PUID/PGID.
    # Run as Umbrel's user so it can write to the app data and Downloads folders.
    user: "1000:1000"
    restart: on-failure
    environment:
      UMASK: "022"
    volumes:
      - ${APP_DATA_DIR}/data:/opt/openlist/data
      - ${UMBREL_ROOT}/data/storage/downloads:/opt/openlist/data1
