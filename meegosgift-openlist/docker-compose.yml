version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: meegosgift-openlist_server_1
      APP_PORT: 5244

  server:
    image: openlistteam/openlist:v4.2.9
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
    volumes:
      - ${APP_DATA_DIR}/data:/opt/openlist/data
      - ${UMBREL_ROOT}/data/storage/downloads:/opt/openlist/data1
