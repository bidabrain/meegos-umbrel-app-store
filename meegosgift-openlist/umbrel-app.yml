manifestVersion: 1
id: meegosgift-openlist
name: OpenList
tagline: A new AList fork to anti trust crisis
icon: https://cdn.jsdelivr.net/gh/Cp0204/CasaOS-AppStore-Play@main/Apps/openlist/icon.png
category: files
version: "4.2.9-1"
